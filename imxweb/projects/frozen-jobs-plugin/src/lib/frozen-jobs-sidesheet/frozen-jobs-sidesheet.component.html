<div eui-sidesheet-content>
  @if (data.frozenJobs.length === 0) {
    <div class="imx-no-results">
      <eui-icon icon="content-alert" size="xl"></eui-icon>
      <p>No frozen jobs found.</p>
    </div>
  } @else {
    <mat-card>
      <table mat-table [dataSource]="data.frozenJobs" class="mat-elevation-z0" style="width: 100%">
        <ng-container matColumnDef="StartTime">
          <th mat-header-cell *matHeaderCellDef>Time</th>
          <td mat-cell *matCellDef="let job">{{ job.StartTime | date:'short' }}</td>
        </ng-container>

        <ng-container matColumnDef="JobChainName">
          <th mat-header-cell *matHeaderCellDef>Operation</th>
          <td mat-cell *matCellDef="let job">{{ job.JobChainName }}</td>
        </ng-container>

        <ng-container matColumnDef="CausingObject">
          <th mat-header-cell *matHeaderCellDef>Object</th>
          <td mat-cell *matCellDef="let job">{{ job.CausingObject }}</td>
        </ng-container>

        <ng-container matColumnDef="TargetSystem">
          <th mat-header-cell *matHeaderCellDef>Target System</th>
          <td mat-cell *matCellDef="let job">{{ job.TargetSystem }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let job; columns: displayedColumns;" (click)="onRowClick(job)"></tr>
      </table>
    </mat-card>
  }
</div>
