@if (isAuthorized && !loading) {
  <imx-badge-tile
    data-imx-identifier="start-tile-geo-localities"
    [caption]="'Localities'"
    [tooltip]="localities.length + ' locations — click to view map'"
    [value]="localities.length.toString()"
    [identifier]="'geo-localities'"
    (actionClick)="onTileClick()">
  </imx-badge-tile>
}
